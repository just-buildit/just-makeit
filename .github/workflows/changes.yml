name: changes

# The ONE answer to "is this run a version bump and nothing else?", for every
# workflow that should not spend a build on a version string. A workflow gates
# its jobs on it with
#
#   changes:
#     uses: ./.github/workflows/changes.yml
#   <job>:
#     needs: changes
#     if: needs.changes.outputs.src == 'true'
#
# It used to be a job inside ci.yml alone, so docs.yml, docker.yml and
# nco_tone_ci.yml each filtered on a hand-written `paths:` list that named
# pyproject.toml -- which every release writes -- and a release PR built the
# docs site, two multi-arch images and an end-to-end example for a version
# string. tests/test_release_bump_fast_path.py refuses a PR-triggered workflow
# that a release commit reaches without gating on this.

on:
  workflow_call:
    outputs:
      src:
        description: "'false' for a version bump alone, else 'true'"
        value: ${{ jobs.changes.outputs.src }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.check.outputs.src }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - id: check
        run: |
          # Integration and scheduled events always run everything, and so
          # does a push that is not to a branch: release.yml calls docker.yml
          # on the tag push, and the tag's images must be built. (Only a
          # push: a pull_request's ref is refs/pull/N/merge.)
          case "${{ github.event_name }}" in
            merge_group|workflow_dispatch|schedule)
              echo "src=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ "${{ github.event_name }}" == "push" &&
                "${{ github.ref }}" != refs/heads/* ]]; then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD^"
          else
            # push: diff the whole pushed range. Fail SAFE -- if the previous
            # tip is not reachable in this shallow clone we cannot prove the
            # push is bump-only, so run everything.
            base="${{ github.event.before }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          # Is this a version bump and nothing else? The standard's answer
          # (gh-1537), not a hand-kept list of files: every changed path,
          # except CHANGELOG.md and changelog.d/ (which a release rewrites),
          # must equal its $base copy with the old version replaced by the
          # new one, read through the Makefile's VERSION_PROBES. So a new
          # version site needs no declaration, and a dependency moving in
          # uv.lock fails the substitution and runs everything. The list it
          # replaced went stale once (jb.toml) and had to grow for
          # changelog.d/. It writes src= to $GITHUB_OUTPUT itself.
          make -s ci-changes BASE="$base"
