name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  # Detect whether the commit touches anything beyond CHANGELOG.md /
  # pyproject.toml.  Pure version-bump commits skip the full matrix so a
  # release branch doesn't burn ~60 min of CI for a two-line diff.
  # On push to main we always run — release.yml's verify-ci polls for "CI
  # passed" on the exact merged SHA, so that check must always fire on main.
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.check.outputs.src }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - id: check
        run: |
          # Non-PR events (push, merge_group, workflow_dispatch) always run.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD^"

          # A release commit necessarily touches four files, not two: the
          # bump edits pyproject.toml, then the uv-lock and sync-jb-version
          # hooks regenerate uv.lock and jb.toml. Skipping on only the first
          # two meant every release PR ran the full matrix for a version
          # string.
          changed=$(git diff --name-only "$base" HEAD)
          if echo "$changed" \
             | grep -qvE '^(CHANGELOG\.md|pyproject\.toml|jb\.toml|uv\.lock)$'
          then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # ...but uv.lock also moves for a real dependency change, and
          # pyproject.toml is already skippable, so the file set alone would
          # let a dependency bump through untested. Require that the only
          # pyproject edit is the version line.
          if git diff -U0 "$base" HEAD -- pyproject.toml \
             | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
             | grep -qvE '^[+-]version = '
          then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "src=false" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just-makeit as a tool
        run: |
          # Retry a transient network flake before failing the job.
          for attempt in 1 2 3; do
            uv tool install . && exit 0
            echo "uv tool install attempt $attempt failed (transient?); retrying…"
            sleep 10
          done
          echo "::error::uv tool install failed after 3 attempts"
          exit 1
      - run: jm-install-deps ${{ runner.temp }}/jm-venv
      - run: jm-run-tests

  examples:
    name: Examples (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install just-makeit
        run: |
          # Retry a transient network flake (a curl SSL blip once failed this
          # with exit 35 on a macOS runner) before failing the job.
          for attempt in 1 2 3; do
            uv tool install . && exit 0
            echo "uv tool install attempt $attempt failed (transient?); retrying…"
            sleep 10
          done
          echo "::error::uv tool install failed after 3 attempts"
          exit 1

      - name: Install jbx
        run: |
          _JBS="https://just-buildit.github.io"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "${_JBS}/just-runit" -o "$HOME/.local/bin/just-runit"
          chmod +x "$HOME/.local/bin/just-runit"
          ln -sf just-runit "$HOME/.local/bin/jb"
          ln -sf just-runit "$HOME/.local/bin/jbx"
          ln -sf just-runit "$HOME/.local/bin/just-buildit"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          jbx install-deps -g dev -s apt

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: jbx install-deps -g dev -s brew

      - name: Run example tests
        run: make test-examples

  install-deps-smoke:
    name: jm-install-deps (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install just-makeit as a tool
        run: |
          # Retry a transient network flake (a curl SSL blip once failed this
          # with exit 35 on a macOS runner) before failing the job.
          for attempt in 1 2 3; do
            uv tool install . && exit 0
            echo "uv tool install attempt $attempt failed (transient?); retrying…"
            sleep 10
          done
          echo "::error::uv tool install failed after 3 attempts"
          exit 1

      - name: Run jm-install-deps (pass temp venv path as first arg)
        run: jm-install-deps ${{ runner.temp }}/jm-smoke-venv

      - name: Verify cmake reachable
        run: cmake --version

      - name: Verify C compiler reachable
        shell: bash
        run: |
          command -v gcc || command -v clang || command -v cl \
            || { echo "No C compiler found"; exit 1; }

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install just-makeit and build deps
        run: |
          uv sync --group dev
          uv pip install -e .
          uv run jm-install-deps ${{ runner.temp }}/jm-venv

      - name: Run full test suite with coverage
        env:
          COVERAGE_PROCESS_START: pyproject.toml
        run: |
          uv run pytest \
            --cov=just_makeit \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

  # Formatting/lint gate. Until this existed, `make lint` was local-only: a
  # broken hook could sit on main indefinitely (docs/developers/why-zensical.md
  # failed mdformat from #469 until gh-581's cleanup found it, because nothing
  # in CI ever ran the hooks). Runs the SAME `make lint` a developer runs, so
  # the two can never disagree about tools, versions, or flags.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # >=3.10 so mdformat is installable; `make lint-mdformat` would
          # otherwise self-skip and the gate would silently check nothing.
          python-version: "3.12"

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Run make lint
        run: make lint

      # A hook that rewrites a file exits non-zero, so the step above already
      # failed — but the diff is what tells you WHAT to fix.
      - name: Show what the hooks changed
        if: failure()
        run: git --no-pager diff

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test, examples, install-deps-smoke, coverage, lint]
    if: always()
    steps:
      - run: |
          # Bump-only PRs skip the matrix (src=false) — that is expected and green.
          if [[ "${{ needs.changes.outputs.src }}" == "false" ]]; then exit 0; fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi

  trigger-mirror:
    name: Trigger docs mirror refresh
    # Nudges just-buildit.github.io's mirror.yml (repository_dispatch:
    # mirror) to refresh immediately instead of waiting for its daily cron.
    # Never blocks anything else in this repo — not a required check.
    needs: ci-passed
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-passed.result == 'success'
    steps:
      - name: Dispatch mirror refresh
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          gh api repos/just-buildit/just-buildit.github.io/dispatches \
            -f event_type=mirror
