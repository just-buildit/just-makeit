<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="#0d1117"/>

  <!-- Outer hex-nut (flat-top, radius 84) -->
  <polygon
    fill="#94a3b8"
    points="
      184,100
      142,27
       58,27
       16,100
       58,173
      142,173
    "
  />

  <!-- Inner cutout (radius 52) -->
  <polygon
    fill="#0d1117"
    points="
      152,100
      126,55
       74,55
       48,100
       74,145
      126,145
    "
  />

  <!-- "jm" wordmark — baseline raised to account for j descender -->
  <text
    x="100" y="107"
    font-family="'Courier New', Courier, monospace"
    font-size="44"
    font-weight="bold"
    fill="#ffffff"
    text-anchor="middle"
  >jm</text>

</svg>
