site_name: just-makeit
site_description: Python C extensions the easy way.
site_url: https://just-buildit.github.io/just-makeit/
repo_url: https://github.com/just-buildit/just-makeit
repo_name: just-buildit/just-makeit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Commands: commands.md
  - Template Reference: template.md
  - Customization: customization.md
