[project]
name    = "<<project_underscore>>"
version = "<<version>>"

[tools.install-deps]
source = "just-bashit:install-deps"
groups = ["dev"]

[tools.just-makeit]
source = "https://just-buildit.github.io/just-makeit/install.sh"
config = "just-makeit.toml"

# Build dependencies — populated by just-makeit new.
# Add [runtime.*] sections for your project's own system libraries.
# patchelf (Linux): auditwheel needs it to repair a wheel.

[dev.apt]
packages = [
    "build-essential",
    "cmake",
    "patchelf",
    "pkg-config",
    "python3-dev",
    "python3-numpy",
]

[dev.pacman]
packages = [
    "base-devel",
    "cmake",
    "patchelf",
    "pkgconf",
    "python",
    "python-numpy",
]

[dev.brew]
packages = [
    "cmake",
    "pkg-config",
]

[dev.dnf]
packages = [
    "gcc",
    "gcc-c++",
    "make",
    "cmake",
    "patchelf",
    "pkgconf-pkg-config",
    "python3-devel",
    "python3-numpy",
]

[dev.zypper]
packages = [
    "gcc",
    "gcc-c++",
    "make",
    "cmake",
    "patchelf",
    "pkg-config",
    "python3-devel",
    "python3-numpy",
]
