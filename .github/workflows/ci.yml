name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv tool install .
      - run: jm-install-deps ${{ runner.temp }}/jm-venv
      - run: jm-run-tests

  examples:
    name: Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install just-makeit
        run: uv tool install .

      - name: Install jbx
        run: |
          _JBS="https://raw.githubusercontent.com/just-buildit/just-bashit/main/src"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "${_JBS}/just-runit" -o "$HOME/.local/bin/just-runit"
          chmod +x "$HOME/.local/bin/just-runit"
          ln -sf just-runit "$HOME/.local/bin/jb"
          ln -sf just-runit "$HOME/.local/bin/jbx"
          ln -sf just-runit "$HOME/.local/bin/just-buildit"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          jbx install-deps -g dev -s apt

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: jbx install-deps -g dev -s brew

      - name: Run example tests
        run: make test-examples

  install-deps-smoke:
    name: jm-install-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install just-makeit as a tool
        run: uv tool install .

      - name: Run jm-install-deps (pass temp venv path as first arg)
        run: jm-install-deps ${{ runner.temp }}/jm-smoke-venv

      - name: Verify cmake reachable
        run: cmake --version

      - name: Verify C compiler reachable
        shell: bash
        run: |
          command -v gcc || command -v clang || command -v cl \
            || { echo "No C compiler found"; exit 1; }

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install just-makeit and build deps
        run: |
          uv sync --group dev
          uv pip install -e .
          uv run jm-install-deps ${{ runner.temp }}/jm-venv

      - name: Run full test suite with coverage
        env:
          COVERAGE_PROCESS_START: pyproject.toml
        run: |
          uv run pytest \
            --cov=just_makeit \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [test, examples, install-deps-smoke, coverage]
    if: always()
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi
