name: Docker examples

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # A called workflow inherits the CALLER's ref and event. On a tag push
      # that ref is the tag, which is right; on release.yml's dispatch path it
      # is the branch, which would build an image from the wrong tree. So the
      # caller says explicitly what to build.
      ref:
        type: string
        required: false
        default: ""
      # ...and whether to publish: this input and nothing else. A called
      # workflow's `github.event_name` is the CALLER's -- `workflow_dispatch`
      # on release.yml's dispatch path, which an event check did not list, so
      # the images were built and silently not pushed; and ci.yml calls this
      # on a pull_request too. Off by default, so a new
      # caller builds and smoke-tests without pushing anything.
      publish:
        type: boolean
        required: false
        default: false

# No `push` or `pull_request` trigger of its own (gh-1643). ci.yml calls
# this workflow from a job `CI passed` waits on, on every PR and every push to
# main that is more than a version bump, and publishes only on the push. With
# triggers of its own it was red on main for 9 hours after #1602 (and for 14
# runs before that, gh-1089) while every PR merged green, because no required
# check waited on it; and its PR `paths` list did not name this file, so the
# PR fixing it never ran it. Both were the same mistake -- a second, hand-kept
# answer to "does this run need the image?" -- and ci.yml already has the one
# answer, changes.yml. tests/test_gh1632_workflow_gates.py refuses a
# PR-triggered workflow outside ci.yml.

permissions:
  contents: read
  packages: write

jobs:
  # ── Linux ─────────────────────────────────────────────────────────────────────
  # One native build per architecture (no QEMU) — each is loaded into its
  # runner's local daemon and smoke-tested before anything is pushed.
  linux:
    name: Linux image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local daemon so the smoke test can run it.
      # GHA layer cache keeps subsequent builds fast (scoped per-arch so the
      # amd64 and arm64 legs don't thrash each other's cache).
      - name: Build Linux image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=linux-${{ matrix.arch }} \
            --cache-to   type=gha,mode=max,scope=linux-${{ matrix.arch }} \
            --load \
            -t jm-examples-linux:ci \
            -f docker/Dockerfile.examples-linux \
            .

      # Verify every example scaffolded a compiled .so file.
      - name: Smoke-test — compiled .so present for all examples
        run: |
          docker run --rm \
            --workdir /home/just-makeit/examples \
            jm-examples-linux:ci \
            python3 - <<'PYEOF'
          import pathlib, sys
          missing = []
          for proj in sorted(pathlib.Path(".").iterdir()):
              if not proj.is_dir():
                  continue
              sos = list(proj.rglob("*.so"))
              if sos:
                  print(f"  ok   {proj.name}  ({sos[0].name})")
              else:
                  print(f"  MISS {proj.name}")
                  missing.append(proj.name)
          if missing:
              sys.exit(f"no .so in: {missing}")
          PYEOF

      # Verify that the fir_filter install placed a working pkg-config file.
      - name: Smoke-test — pkg-config resolves installed fir_filter library
        run: |
          docker run --rm jm-examples-linux:ci bash -c '
            set -euo pipefail
            PC_DIR=$(find /home/just-makeit/examples/my_fir/install \
                          -type d -name pkgconfig 2>/dev/null | head -1)
            if [ -z "$PC_DIR" ]; then
              echo "ERROR: no pkgconfig dir found under my_fir/install" >&2
              exit 1
            fi
            export PKG_CONFIG_PATH="$PC_DIR"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            pkg-config --modversion my_fir
            pkg-config --cflags my_fir
            pkg-config --libs my_fir
            echo "pkg-config OK"
          '

      # Push an arch-suffixed tag on every publishing run — never :latest
      # directly, so that tag never briefly points at a single-arch image.
      # The manifest job below combines these into the public tags.
      - name: Tag and push arch-specific image to GHCR
        if: inputs.publish
        run: |
          BASE=ghcr.io/${{ github.repository_owner }}/jm-examples-linux
          docker tag jm-examples-linux:ci "${BASE}:sha-${{ github.sha }}-${{ matrix.arch }}"
          docker push "${BASE}:sha-${{ github.sha }}-${{ matrix.arch }}"

  # Combine the per-arch images pushed above into the public, multi-arch
  # :latest / :sha-<sha> manifest list — the same tag contract every existing
  # puller already relies on, now backed by more than one platform.
  manifest:
    name: Publish multi-arch manifest
    needs: linux
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push combined manifest
        run: |
          BASE=ghcr.io/${{ github.repository_owner }}/jm-examples-linux
          # Retry: this reads both arch manifests' blobs back out of GHCR, and
          # a reset there fails the job after BOTH images have already built
          # and pushed — the most expensive place to lose to a network blip:
          #   httpReadSeeker: failed open: ... read: connection reset by peer
          # `imagetools create` overwrites the tags it is given, so re-running
          # it is idempotent rather than additive. Third instance tonight of
          # "network-dependent command with no retry on the release path"
          # (gh-851's siblings were apt in artifact.yml and the uv cache).
          ok=""
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
                 -t "${BASE}:latest" \
                 -t "${BASE}:sha-${{ github.sha }}" \
                 "${BASE}:sha-${{ github.sha }}-amd64" \
                 "${BASE}:sha-${{ github.sha }}-arm64"; then
              ok=1
              break
            fi
            echo "imagetools create attempt $attempt failed; retrying…"
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error::imagetools create failed after 3 attempts"
            exit 1
          fi
