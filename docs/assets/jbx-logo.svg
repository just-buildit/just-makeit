<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!-- jbx is just-bashit's tool, so it wears just-bashit's colours: a gray
       tile (darker than its logo's #46484d), the amber prompt and a white
       cursor, with the same square ends. One line: the cursor sits on the
       chevron's own centre line. -->
  <rect width="200" height="200" rx="32" fill="#2b2d31"/>

  <!-- Run: the prompt chevron -->
  <path
    d="M30 62 L86 100 L30 138"
    fill="none"
    stroke="#f59e0b"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Discard: the cursor fades out and nothing is left behind -->
  <rect x="118" y="78" width="24" height="44" fill="#ffffff"/>
  <rect x="148" y="78" width="14" height="44" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="168" y="78" width="8" height="44" fill="#ffffff" fill-opacity="0.25"/>

</svg>
