# just-makeit's jbx alias manifest, served at the site root beside install.sh.
#
# `jbx just-makeit:NAME` fetches <site>/aliases.toml FIRST and only probes
# <site>/NAME.sh / NAME.py when NAME is not listed here, so `install-deps`
# resolves to the installer this site already serves, with no second file.
# From PowerShell, jbx reads [aliases.ps1] instead, then probes NAME.ps1
# (just-bashit#235); an older jbx matches only the literal `[aliases]`
# header and ignores that table. tests/test_aliases_toml_published.py holds
# every target in both tables to a file the site-files recipe ships.

[aliases]
install-deps = "https://just-buildit.github.io/just-makeit/install.sh"

[aliases.ps1]
install = "https://just-buildit.github.io/just-makeit/install.ps1"
