[build-system]
requires = ["just-buildit", "numpy"]
build-backend = "just_buildit"

[project]
name = "<<project>>"
version = "<<version>>"
description = "TODO: describe your project."
readme = "README.md"
requires-python = "<<requires_python>>"
# The Python versions this project supports: its CI tests each one, and
# `jm apply` keeps .github/workflows/ci.yml equal to this list.
classifiers = [
<<python_classifiers>>
]
dependencies = [
    "numpy",
]

[tool.just-buildit]
command = "make just-build"

[tool.pytest.ini_options]
testpaths = ["src"]
