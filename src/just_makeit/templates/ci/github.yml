name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # cmake and a C compiler are preinstalled on the GitHub-hosted
      # ubuntu/macos/ubuntu-arm runners; only the Python build/test deps
      # are needed.
      - name: Install build dependencies
        run: python -m pip install --upgrade pip <<pip_deps>>

      - name: Build
        run: make

      - name: Test
        run: make test
