name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # cmake and a C compiler are preinstalled on the GitHub-hosted
      # ubuntu/macos runners; only the Python build/test deps are needed.
      - name: Install build dependencies
        run: python -m pip install --upgrade pip <<pip_deps>>

      - name: Build
        run: make

      - name: Test
        run: make test
