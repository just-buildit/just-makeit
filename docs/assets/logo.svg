<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <defs>
    <!-- Slate, lit from above: the nut reads as a solid part, not a flat shape -->
    <linearGradient id="nut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="#0d1117"/>

  <!-- Outer hex-nut (flat-top, radius 84) -->
  <polygon
    fill="url(#nut)"
    points="
      184,100
      142,27
       58,27
       16,100
       58,173
      142,173
    "
  />

  <!-- Inner cutout (radius 52) -->
  <polygon
    fill="#0d1117"
    points="
      152,100
      126,55
       74,55
       48,100
       74,145
      126,145
    "
  />

  <!-- "jm" wordmark, bigger than it was so it still reads at 32 px -->
  <text
    x="100" y="116"
    font-family="'Courier New', Courier, monospace"
    font-size="50"
    font-weight="bold"
    fill="#ffffff"
    text-anchor="middle"
  >jm</text>

</svg>
