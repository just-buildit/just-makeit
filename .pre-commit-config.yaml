repos:
  - repo: local
    hooks:
      - id: sync-jb-version
        name: sync jb.toml version from pyproject.toml
        entry: python3 scripts/sync_version.py
        language: system
        files: ^(pyproject\.toml|jb\.toml)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.28
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix,  --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: ^(\.venv/|src/just_makeit/templates/)

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        files: ^src/just_makeit/templates/cmake/
        # Templates that lead with ``<<placeholder>>`` tokens are not valid
        # CMake until rendered, so cmake-format's tokenizer rejects them.
        exclude: CMakeLists_(component|module|object_core)\.cmake
        # cmake-format reads .cmake-format.yaml; its isolated hook env needs
        # PyYAML to parse it, else the hook dies with ModuleNotFoundError.
        additional_dependencies: [pyyaml]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0 # Use latest version
    hooks:
    - id: mdformat
      # templates/ holds <<placeholder>> markdown that isn't valid until
      # rendered; mdformat escapes the `<` (e.g. `# \<<project>>`), which
      # then renders a stray backslash and breaks mkdocstrings/zensical.
      exclude: ^(examples/|src/just_makeit/examples/|src/just_makeit/templates/|docs/index\.md$)
      # Add optional plugins (e.g., for GFM or code block formatting)
      additional_dependencies:
      - mdformat-gfm
      - mdformat-gfm-alerts
      - mdformat-mkdocs
