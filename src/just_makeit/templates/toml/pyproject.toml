[build-system]
requires = ["just-buildit", "numpy"]
build-backend = "just_buildit"

[project]
name = "<<project>>"
version = "<<version>>"
description = "TODO: describe your project."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[tool.just-buildit]
command = "make just-build"

[tool.pytest.ini_options]
testpaths = ["src"]

# TOML layout, for `tombi format` or an editor running tombi's language
# server: 79 columns, 4-space indent. Schemas are off so tombi never sorts
# your dependencies, classifiers or tables -- it lays out, it does not
# reorder. Everything jm writes into this project already passes it.
[tool.tombi.format.rules]
line-width = 79
indent-width = 4

[tool.tombi.schema]
enabled = false
