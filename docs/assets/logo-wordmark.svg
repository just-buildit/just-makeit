<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">

  <!-- Background -->
  <rect width="540" height="120" rx="20" fill="#0d1117"/>

  <!-- Hex-nut icon (flat-top, outer r≈40, center 55,60) -->
  <polygon
    fill="#94a3b8"
    points="95,60 75,94 35,94 15,60 35,26 75,26"
  />
  <polygon
    fill="#0d1117"
    points="83,60 69,84 41,84 27,60 41,36 69,36"
  />
  <text
    x="55" y="66"
    font-family="'Courier New', Courier, monospace"
    font-size="20"
    font-weight="bold"
    fill="#ffffff"
    text-anchor="middle"
  >jm</text>

  <!-- Divider -->
  <line x1="112" y1="24" x2="112" y2="96" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Wordmark -->
  <text
    x="132" y="58"
    font-family="'Courier New', Courier, monospace"
    font-size="30"
    font-weight="bold"
    fill="#94a3b8"
    dominant-baseline="middle"
  >just-makeit</text>

  <!-- Tagline -->
  <text
    x="134" y="84"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    fill="#6b7280"
    dominant-baseline="middle"
  >Python C extensions made easy</text>

</svg>
