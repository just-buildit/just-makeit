name: changes

# The ONE answer to "is this run a version bump and nothing else?", for every
# workflow that should not spend a build on a version string. A workflow gates
# its jobs on it with
#
#   changes:
#     uses: ./.github/workflows/changes.yml
#     permissions:
#       checks: read
#       contents: read
#   <job>:
#     needs: changes
#     if: needs.changes.outputs.src == 'true'
#
# It used to be a job inside ci.yml alone, so docs.yml, docker.yml and
# nco_tone_ci.yml each filtered on a hand-written `paths:` list that named
# pyproject.toml -- which every release writes -- and a release PR built the
# docs site, two multi-arch images and an end-to-end example for a version
# string. tests/test_release_bump_fast_path.py refuses a PR-triggered workflow
# that a release commit reaches without gating on this.

on:
  workflow_call:
    outputs:
      src:
        description: "'false' for a version bump alone or a tree already tested, else 'true'"
        value: ${{ jobs.changes.outputs.src }}
      tested:
        description: "'true' when a push's tree already passed CI as a merged PR"
        value: ${{ jobs.changes.outputs.tested }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # `checks: read` is for the base commit's "CI passed" (gh-1763). A
    # reusable workflow's token is capped by its caller's, and the repo's
    # default token grants no `checks`, so every caller grants these too;
    # tests/test_release_bump_fast_path.py refuses a caller that does not.
    permissions:
      checks: read
      contents: read
    outputs:
      src: ${{ steps.check.outputs.src }}
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - id: check
        # Every value the script reads comes in through env, so
        # tests/test_release_bump_fast_path.py runs this exact `run:` text
        # with a fake `gh` and no GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          CI_CHECK: CI passed
        run: |
          # Dispatched and scheduled events always run everything, and so
          # does a push that is not to a branch: release.yml calls docker.yml
          # on the tag push, and the tag's images must be built. (Only a
          # push: a pull_request's ref is refs/pull/N/merge.)
          case "$EVENT" in
            workflow_dispatch|schedule)
              echo "src=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ "$EVENT" == "push" && "$REF" != refs/heads/* ]]; then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [[ "$EVENT" == "pull_request" ]]; then
            base="$PR_BASE"
            git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD^"
          else
            # Each tree that lands on main is tested once (gh-1801). A merged
            # PR whose head IS this tree, contains the tip this push replaced,
            # and passed "CI passed" already ran the matrix on exactly this
            # code, so main does not run it again. The canonical answer is
            # `make ci-tree-tested`; it fails safe (tested=false) on any
            # doubt, and so does a helper that cannot run at all. It writes
            # tested= to $GITHUB_OUTPUT itself. This comes BEFORE the bump
            # check because it proves the tree passed directly: a superseded
            # pending run on the base no longer leaves the commit uncertified.
            tested=$(GITHUB_REPOSITORY="$REPO" CI_CHECK_NAME="$CI_CHECK" \
                       make -s ci-tree-tested BEFORE="$BEFORE" \
                     | sed -n 's/^tested=//p') || tested=false
            if [[ "$tested" == "true" ]]; then
              echo "src=false" >> "$GITHUB_OUTPUT"; exit 0
            fi

            # push: diff the whole pushed range. Fail SAFE -- if the previous
            # tip is not reachable in this shallow clone we cannot prove the
            # push is bump-only, so run everything.
            base="$BEFORE"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
            fi

            # A bump skips CI only because the code under it already passed
            # it -- so that has to be TRUE, not assumed (gh-1763). A push's
            # base is the branch's previous tip, and ci.yml's concurrency
            # group keeps ONE pending run per group: a third push cancels the
            # second's pending run, which then never runs at all. Cutting
            # 0.96.0, #1759's merge (07f09d2) was superseded that way and has
            # no "CI passed" check; the bump-only release commit on top of it
            # would have been certified green over code main never ran.
            #
            # So the fast path holds only when the base has a COMPLETED,
            # SUCCESSFUL "CI passed". Anything else -- in progress, cancelled,
            # failed, absent, or an API error -- runs everything. A PR needs
            # no such check: its own run covers its whole diff.
            if ! runs=$(gh api --paginate \
                   "repos/$REPO/commits/$base/check-runs?per_page=100"); then
              echo "src=true" >> "$GITHUB_OUTPUT"
              echo "changes: cannot read $base's checks; running all" >&2
              exit 0
            fi
            verdict=$(printf '%s\n' "$runs" | jq -r --arg n "$CI_CHECK" \
              '.check_runs[] | select(.name == $n)
               | "\(.status) \(.conclusion)"' | head -n1) || verdict=""
            if [[ "$verdict" != "completed success" ]]; then
              echo "src=true" >> "$GITHUB_OUTPUT"
              echo "changes: $base's '$CI_CHECK' is '${verdict:-absent}'," \
                   "not a pass; running all" >&2
              exit 0
            fi
          fi

          # Is this a version bump and nothing else? The standard's answer
          # (gh-1537), not a hand-kept list of files: every changed path,
          # except CHANGELOG.md and changelog.d/ (which a release rewrites),
          # must equal its $base copy with the old version replaced by the
          # new one, read through the Makefile's VERSION_PROBES. So a new
          # version site needs no declaration, and a dependency moving in
          # uv.lock fails the substitution and runs everything. The list it
          # replaced went stale once (jb.toml) and had to grow for
          # changelog.d/. It writes src= to $GITHUB_OUTPUT itself.
          make -s ci-changes BASE="$base"
