name: nco_tone example

on:
  push:
    branches: ["main"]
    paths:
      - "src/just_makeit/examples/nco_tone/**"
      - "src/just_makeit/_apply.py"
      - "src/just_makeit/_config.py"
      - "src/just_makeit/_init.py"
      - "src/just_makeit/templates/cmake/CMakeLists_component.cmake"
      - ".github/workflows/nco_tone_ci.yml"
  pull_request:
    paths:
      - "src/just_makeit/examples/nco_tone/**"
      - "src/just_makeit/_apply.py"
      - "src/just_makeit/_config.py"
      - "src/just_makeit/_init.py"
      - "src/just_makeit/templates/cmake/CMakeLists_component.cmake"
      - ".github/workflows/nco_tone_ci.yml"
  workflow_dispatch:

jobs:
  nco-tone:
    name: nco_tone (Ubuntu, static doppler)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install system build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake gcc

      - name: Install just-makeit
        run: |
          uv tool install .
          uv sync

      - name: Install jm build deps (cmake, Python, NumPy)
        run: jm-install-deps ${{ runner.temp }}/jm-venv

      # ── Install doppler from its GitHub release ────────────────────────────
      # doppler ships a self-contained static target (doppler::doppler-static),
      # which the example links — so we just extract the tarball; no .so strip
      # or SHARED→STATIC cmake patching is needed (that hack was for the old
      # single doppler::doppler_lib SHARED target, removed in 0.13.x).
      - name: Download doppler release
        run: |
          gh release download \
            --repo doppler-dsp/doppler \
            --pattern "doppler-*-linux-x86_64.tar.gz" \
            --dir /tmp/doppler-dl
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install doppler
        run: |
          mkdir -p /tmp/doppler
          tar xzf /tmp/doppler-dl/doppler-*-linux-x86_64.tar.gz \
              -C /tmp/doppler --strip-components=1

      # ── Run the nco_tone example ────────────────────────────────────────────
      # Pass the install prefix; cmake's find_package searches both
      # <prefix>/lib/cmake and <prefix>/lib64/cmake, so this is libdir-agnostic.
      - name: Run nco_tone example
        run: |
          uv run python src/just_makeit/examples/nco_tone/test.py \
            --doppler-prefix /tmp/doppler
