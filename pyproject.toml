[build-system]
requires = ["just-buildit>=0.3.6"]
build-backend = "just_buildit"

[project]
name = "just-makeit"
version = "0.43.1"
description = "Scaffold and build Python C extensions with CMake and just-buildit."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Matthew T. Hunter, Ph.D." },
    { name = "Claude Code", email = "noreply@anthropic.com" },
]
dependencies = [
    "tomlkit>=0.15.0",
    # tomllib is stdlib only on 3.11+; pull the tomli backport on 3.9/3.10 so
    # just-makeit stays runnable down to the 3.9 floor (tomlkit needs >=3.9).
    "tomli>=2.0.0; python_version < '3.11'",
]
keywords = [
    "c-extension", "cmake", "pep517", "build-backend", "scaffolding",
    "code-generation", "numpy", "packaging", "wheel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/just-buildit/just-makeit"
Repository = "https://github.com/just-buildit/just-makeit"
"Bug Tracker" = "https://github.com/just-buildit/just-makeit/issues"

[project.scripts]
just-makeit = "just_makeit._cli:main"
jm = "just_makeit._cli:main"
jm-install-deps = "just_makeit._scripts:install_deps"
jm-run-tests = "just_makeit._scripts:run_tests"
jm-docker-e2e = "just_makeit._scripts:docker_e2e"

[tool.just-buildit]
# just-makeit is pure Python — but src/just_makeit/examples/ ships .c source
# fragments as package data. 'pure' tells just-buildit to copy the tree
# verbatim (keeping those .c/.h files) and compile nothing.
pure = true

[tool.ruff]
line-length = 79
extend-exclude = ["src/just_makeit/templates/"]

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["E402"], "docker/*" = ["E402"], "src/just_makeit/examples/*" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: compiles a generated project (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["just_makeit"]
branch = true
parallel = true
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]


[dependency-groups]
# This group is the single source of truth for DEV TOOL VERSIONS. The Makefile
# is the single source of truth for how those tools are INVOKED, and every
# caller — humans, pre-commit hooks, CI — routes through a Makefile target.
# Nothing should install a linter another way (an unpinned `uvx ruff` resolves
# to whatever released today and silently reformats files the pinned ruff does
# not), and nothing should carry a second copy of the version.
dev = [
    "cmakelang",
    "just-buildit",
    # Formatters. Pinned exactly: a formatter is only useful if every machine
    # and CI agree byte-for-byte on its output, so these move deliberately, not
    # on resolution. `ruff` must match the version the CI lint gate runs.
    "ruff==0.15.21",
    # mdformat's plugins were previously unpinned pre-commit
    # `additional_dependencies`, which is how the env drifted to
    # mdformat-mkdocs 5.1.4 while the config still claimed 1.0.0. Gated to
    # >=3.10 (mdformat 1.x dropped 3.9) like mypy/zensical below; `make
    # lint-mdformat` self-skips when it is unavailable, so the 3.9 dev leg
    # still works and CI (which runs a modern Python) still enforces.
    "mdformat==1.0.0; python_version >= '3.10'",
    "mdformat-gfm==1.0.0; python_version >= '3.10'",
    "mdformat-gfm-alerts==2.0.0; python_version >= '3.10'",
    "mdformat-mkdocs==5.1.4; python_version >= '3.10'",
    "mkdocstrings-python>=2.0.3; python_version >= '3.10'",
    # Pinned: stubtest's strictness (e.g. @final / @disjoint_base class
    # markers) is coupled to the mypy version, and the stub-conformance gate
    # (tests/test_stub_conformance.py) must be deterministic across machines.
    # Gated to >=3.10 (mypy 2.3 dropped 3.9); the gate self-skips without mypy,
    # so the 3.9 leg simply does not run it.
    "mypy==2.3.*; python_version >= '3.10'",
    "numpy",
    "pre-commit",
    "pytest",
    "pytest-benchmark",
    "pytest-cov>=7.1.0",
    # Docs tooling; zensical requires >=3.10, so gate it to keep dev deps
    # resolvable on the 3.9 floor.
    "zensical>=0.0.29; python_version >= '3.10'",
    "pytest-xdist>=3.8.0",
]
