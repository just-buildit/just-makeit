# ============================================================================
# just-makeit — Zensical documentation configuration
# https://zensical.org/docs/
# ============================================================================

[project]
site_name        = "just-makeit"
site_description = "Python C extensions the easy way."
site_url         = "https://just-buildit.github.io/just-makeit/"
repo_url         = "https://github.com/just-buildit/just-makeit"
copyright        = "Copyright &copy; 2026 just-buildit contributors — MIT License"

nav = [
  { "Home"               = "index.md"        },
  { "Workflow"           = "workflow.md"     },
  { "Commands"           = "commands.md"     },
  { "Stateful vs Pure"   = "pure.md"         },
  { "Performance"        = "perf.md"         },
  { "State Types"        = "types.md"        },
  { "Template Reference" = "template.md"     },
  { "Customization"      = "customization.md"},
  { "Roadmap"            = "roadmap.md"      },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
logo     = "assets/logo.svg"
favicon  = "assets/logo.svg"
language = "en"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Dark mode first
[[project.theme.palette]]
scheme      = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme      = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/just-buildit/just-makeit"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/just-makeit/"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
