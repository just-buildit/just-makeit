name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

# A force-push used to leave the superseded run burning all 18 matrix legs to
# completion, which wastes minutes and leaves confusing check state on the PR.
# Cancel only PR runs: a main or merge_group result is something else depends
# on (release.yml's verify-ci polls for "CI passed" on the merged SHA), so
# those must always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether the commit touches anything beyond the four files a version
  # bump necessarily moves. Pure version-bump commits skip the full matrix so a
  # release doesn't burn ~15 min of CI for a two-line diff.
  #
  # This applies to `push` as well as `pull_request` (gh-716). It used to
  # short-circuit to src=true for every non-PR event, on the grounds that
  # release.yml's verify-ci polls for "CI passed" on the merged SHA "so that
  # check must always fire on main". That conflated *the check firing* with
  # *the matrix running*: `ci-passed` has `if: always()` and already exits 0
  # when src=false, so it goes green either way. Measured cost of the
  # conflation: a release bump took 15m13s on main having just taken 2m22s as
  # a PR, for byte-identical content, on every release.
  #
  # Nothing goes untested. The bump's parent is the code merge, which got the
  # full matrix; the bump itself adds a version string; and release.yml
  # independently builds the wheel and runs the scaffold->cmake->test smoke on
  # the tagged commit. merge_group and workflow_dispatch still always run —
  # those are integration events where testing the combined tree is the point.
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.check.outputs.src }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - id: check
        run: |
          # Integration events always run the full matrix.
          case "${{ github.event_name }}" in
            merge_group|workflow_dispatch)
              echo "src=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD^"
          else
            # push: diff the whole pushed range. Fail SAFE -- if the previous
            # tip is not reachable in this shallow clone we cannot prove the
            # push is bump-only, so run everything.
            base="${{ github.event.before }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          # A release commit necessarily touches four files, not two: the
          # bump edits pyproject.toml, then the uv-lock and sync-jb-version
          # hooks regenerate uv.lock and jb.toml. Skipping on only the first
          # two meant every release PR ran the full matrix for a version
          # string.
          changed=$(git diff --name-only "$base" HEAD)
          if echo "$changed" \
             | grep -qvE '^(CHANGELOG\.md|pyproject\.toml|jb\.toml|uv\.lock)$'
          then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # ...but uv.lock also moves for a real dependency change, and
          # pyproject.toml is already skippable, so the file set alone would
          # let a dependency bump through untested. Require that the only
          # pyproject edit is the version line.
          if git diff -U0 "$base" HEAD -- pyproject.toml \
             | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
             | grep -qvE '^[+-]version = '
          then
            echo "src=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "src=false" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing below consumes the installed tool any more — `make install-deps`
      # and `make test` both work from the checkout. This is kept deliberately,
      # as the ONLY check that the package installs on every OS x Python in the
      # matrix; install-deps-smoke covers 3.12 alone. Dropping it because it is
      # no longer a prerequisite would quietly narrow that from 18 combinations
      # to 3.
      - name: Smoke-test that the package installs
        run: make tool-install

      # `make install-deps` — the standard target whose whole job is this, and
      # which `make help` already advertises as "Install system build
      # dependencies (jb.toml)". It hooks jb.toml's `dev` group
      # (build-essential, cmake, pkg-config, python3-dev), which is exactly
      # what the suite needs to cmake-build the projects it scaffolds.
      #
      # This step used to be `jm-install-deps <venv>`, kept on the grounds that
      # it is a shipped entry point doing something no target does. It does do
      # more — it also provisions a venv with numpy and just-makeit — but
      # nothing here consumes that venv: `make test` brings its own numpy and
      # the suite imports just_makeit from src/. So the extra was not
      # load-bearing, and a target that exists was being bypassed.
      #
      # `jm-install-deps` is still exercised on every OS by install-deps-smoke,
      # which is where testing the product belongs.
      - run: make install-deps

      # `make test`, not `jm-run-tests -n auto --dist load`. That looked like
      # the same carve-out as the line above, and it was not: `jm-run-tests` is
      # a second hardcoded copy of the Makefile's PYTEST_ISOLATED invocation,
      # so running jm's OWN unit suite through it put the command outside the
      # SSOT — and it had already drifted two ways. It omits the tomli backport
      # that pyproject requires below 3.11, and it carries no EXAMPLES_IGNORE,
      # so the matrix re-ran the end-to-end example builds that the `examples`
      # job already owns. The `-n auto --dist load` literal here was the third
      # copy: the parallelism setting for the suite lived in a workflow file
      # rather than beside every other pytest flag.
      #
      # The shipped runner keeps its own coverage in `install-deps-smoke`.
      - run: make test
        # `macos-latest, 3.9` failed once on the 0.38.2 release commit with the
        # log ending at 99% and NO pytest summary, so there was no way to tell
        # which test died -- only that the job exited 1.
        #
        # That was called a flake at the time on the evidence that a re-run
        # passed. The likelier mechanism: `jm-run-tests`, which this step used
        # to call, capped the suite at `timeout=600` while this leg took 464s,
        # so a slow runner raised TimeoutExpired mid-suite -- which produces
        # exactly that signature, and which a re-run "fixes" just as
        # convincingly as a flake. The cap is gone; the job's own
        # `timeout-minutes` is the right bound.
        #
        # PYTEST_ADDOPTS is read by pytest itself, so it survives make -> uv ->
        # pytest and the report is written however the suite is invoked.
        # Retrying the step instead would have hidden a real failure just as
        # effectively as it hides a flake.
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=${{ runner.temp }}/pytest-report.xml
            -o junit_family=legacy

      - name: Upload the test report when the suite fails
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore

  examples:
    name: Examples (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install just-makeit
        run: make tool-install

      - name: Install jbx
        run: |
          _JBS="https://just-buildit.github.io"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "${_JBS}/just-runit" -o "$HOME/.local/bin/just-runit"
          chmod +x "$HOME/.local/bin/just-runit"
          ln -sf just-runit "$HOME/.local/bin/jb"
          ln -sf just-runit "$HOME/.local/bin/jbx"
          ln -sf just-runit "$HOME/.local/bin/just-buildit"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          make install-deps-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: make install-deps-dev

      - name: Run example tests
        run: make test-examples

  install-deps-smoke:
    name: jm-install-deps (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install just-makeit as a tool
        run: make tool-install

      - name: Run jm-install-deps (pass temp venv path as first arg)
        run: jm-install-deps ${{ runner.temp }}/jm-smoke-venv

      - name: Verify cmake reachable
        run: cmake --version

      - name: Verify C compiler reachable
        shell: bash
        run: |
          command -v gcc || command -v clang || command -v cl \
            || { echo "No C compiler found"; exit 1; }

      # The `test` matrix used to run jm's whole unit suite through
      # `jm-run-tests`, which meant the shipped runner got exercised as a side
      # effect of testing something else. That suite now goes through
      # `make test` (the SSOT), so the runner needs coverage of its own or it
      # would have none at all. A small selection is enough: what is being
      # checked is that the entry point resolves its isolated environment and
      # hands argv through to pytest, not that the tests pass — the matrix
      # already answers that.
      - name: Smoke-test the shipped jm-run-tests entry point
        run: jm-run-tests tests/test_lint_ssot.py -q

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install just-makeit and build deps
        run: |
          uv sync --group dev
          uv pip install -e .
          uv run jm-install-deps ${{ runner.temp }}/jm-venv

      # `make coverage-gate`, not a bespoke pytest line: the Makefile is the
      # SSOT for how a tool runs, and this invocation was the only one in the
      # repo that CI alone knew — so the command gating every merge was the
      # command nobody could run locally. `make lint` and `make test-examples`
      # already followed this; coverage was the outlier.
      #
      # The *gate*, not the report: `-q` used to keep the percentage out of
      # every log, so "coverage" was enforced by remembering to open Codecov.
      # This fails the job when it drops below COVERAGE_MIN.
      - name: Run full test suite with coverage
        env:
          COVERAGE_PROCESS_START: pyproject.toml
        run: make coverage-gate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

  # Formatting/lint gate. Until this existed, `make lint` was local-only: a
  # broken hook could sit on main indefinitely (docs/developers/why-zensical.md
  # failed mdformat from #469 until gh-581's cleanup found it, because nothing
  # in CI ever ran the hooks). Runs the SAME `make lint` a developer runs, so
  # the two can never disagree about tools, versions, or flags.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          # >=3.10 so mdformat is installable; `make lint-mdformat` would
          # otherwise self-skip and the gate would silently check nothing.
          python-version: "3.12"

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Run make lint
        run: make lint

      # A hook that rewrites a file exits non-zero, so the step above already
      # failed — but the diff is what tells you WHAT to fix.
      - name: Show what the hooks changed
        if: failure()
        run: git --no-pager diff

  # `make bench` ran nowhere — not CI, not release — so nothing could tell you
  # that tests/bench_scaffold.py had stopped working. Not hypothetical: the
  # *product* `jm bench` broke under xdist on 2026-08-03 and was found only
  # because someone happened to run it.
  #
  # This asserts the benchmarks EXECUTE. It deliberately does not assert
  # timings: a shared runner cannot measure them (gh-735), and `make bench`
  # only reports — `bench-compare` is the one that would compare, and it stays
  # out of CI. Costs ~3.5s plus setup, and needs no toolchain, since these
  # benchmark scaffold generation rather than anything compiled.
  bench:
    name: Benchmarks run
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - run: make bench

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test, examples, install-deps-smoke, coverage, lint, bench]
    if: always()
    steps:
      - run: |
          # Bump-only PRs skip the matrix (src=false) — that is expected and green.
          if [[ "${{ needs.changes.outputs.src }}" == "false" ]]; then exit 0; fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi

  trigger-mirror:
    name: Trigger docs mirror refresh
    # Nudges just-buildit.github.io's mirror.yml (repository_dispatch:
    # mirror) to refresh immediately instead of waiting for its daily cron.
    # Never blocks anything else in this repo — not a required check.
    needs: ci-passed
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-passed.result == 'success'
    steps:
      - name: Dispatch mirror refresh
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          gh api repos/just-buildit/just-buildit.github.io/dispatches \
            -f event_type=mirror
