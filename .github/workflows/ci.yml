name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv tool install .
      - run: jm-install-deps ${{ runner.temp }}/jm-venv
      - run: jm-run-tests

  examples:
    name: Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install just-makeit
        run: uv tool install .

      - name: Install jbx
        run: |
          . <(curl -sSL https://just-buildit.github.io/get-jb.sh)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          jbx install-deps -g dev -s apt

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: jbx install-deps -g dev -s brew

      - name: Run example tests
        run: make test-examples

  install-deps-smoke:
    name: jm-install-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install just-makeit as a tool
        run: uv tool install .

      - name: Run jm-install-deps (pass temp venv path as first arg)
        run: jm-install-deps ${{ runner.temp }}/jm-smoke-venv

      - name: Verify cmake reachable
        run: cmake --version

      - name: Verify C compiler reachable
        shell: bash
        run: |
          command -v gcc || command -v clang || command -v cl \
            || { echo "No C compiler found"; exit 1; }
