<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!-- jbx is just-bashit's tool, so it wears just-bashit's colours: a gray
       tile (darker than its logo's #46484d), the amber prompt and a white
       cursor, with the same square ends. The cursor is one bar, low and
       tight to the chevron, the underscore of a >_ prompt. -->
  <rect width="200" height="200" rx="32" fill="#2b2d31"/>

  <!-- Run: the prompt chevron -->
  <path
    d="M30 62 L86 100 L30 138"
    fill="none"
    stroke="#f59e0b"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Discard: a single low cursor bar, sitting on the chevron's
       baseline like the underscore of a >_ prompt -->
  <rect x="104" y="129" width="40" height="18" fill="#ffffff"/>

</svg>
