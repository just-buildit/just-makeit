name: Release
# The tag under release, in the run's title, for both triggers. A dispatch
# (`-f tag=`, the recovery when a tag's own run failed) runs on `main`, so
# `head_branch` names the branch, not the tag; artifact.yml's post-publish
# smoke reads the version from this title instead (v0.109.0 installed
# `just-makeit==main`).
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  # A tag push is a webhook event, so it is exactly what a GitHub Actions
  # incident drops on the floor — and a release that cannot be started is the
  # one automation you most want a manual handle on. The tag must ALREADY
  # exist and already be green; this only re-enters the same pipeline for a
  # tag whose push event never arrived. It does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v0.49.0"
        required: true
        type: string

# gh-2260: one tag push started TWO runs of this workflow (v0.104.0), both
# past verify-ci and racing to publish. Keyed on the TAG, so a duplicate
# push run and a dispatch for the same tag share one group (a dispatch's
# `github.ref` is the branch, so it alone would not). cancel-in-progress
# stays false: cancelling a run mid-publish could leave a version half
# shipped. The later run waits instead, and the "already on PyPI" step in
# `resolve` then ends it green without publishing again.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # One place resolves what is being released, so every job below reads the
  # same answer. On a tag push these are exactly the values the jobs used
  # before (`github.ref_name` / `github.sha`), so that path is unchanged.
  resolve:
    name: Resolve the tag under release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      # "true" only when PyPI already serves this exact version; verify-ci,
      # build, the smokes and publish are skipped then, so a duplicate run
      # cannot publish twice or fail on PyPI's "file exists" (gh-2260).
      #
      # It does NOT skip what comes AFTER publish (gh-2310). The same answer
      # is also what "Re-run all jobs" reads after a release published to
      # PyPI and then failed at github-release or docker: skipping those two
      # on it ended the run green with the release or the image missing.
      # github-release and docker run on it too, and each is idempotent
      # (the release exists -> nothing to create; the image tag exists ->
      # nothing to build), so a duplicate run still ships nothing twice.
      published: ${{ steps.pypi.outputs.published }}
      # "true" only when this tag is the highest vX.Y.Z tag in the repository.
      # docker moves `:latest` only then (gh-2310): a re-run or a dispatch for
      # an OLDER release must not repoint it backwards.
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            # Resolve through the API rather than trusting the input: a tag
            # that does not exist must fail HERE, loudly, and not four jobs
            # later as a confusing checkout error.
            SHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            # An annotated tag's ref points at the tag OBJECT, not the commit.
            TYPE="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')"
            if [[ "$TYPE" == "tag" ]]; then
              SHA="$(gh api "repos/$REPO/git/tags/$SHA" --jq '.object.sha')"
            fi
          else
            TAG="$PUSH_TAG"
            SHA="$PUSH_SHA"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::'$TAG' is not a release tag (must start with v)"; exit 1 ;;
          esac
          echo "Releasing $TAG at $SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Is this the newest release? (gh-2310) docker.yml's manifest step
      # OVERWRITES the tags it is given, and `github-release`/`docker` now run
      # again for a version already on PyPI, so a re-run or a dispatch for an
      # older tag would otherwise point `:latest` at an old image. It FAILS
      # rather than guesses: an unreadable tag list makes this run red and
      # re-runnable, where a guess could move `:latest` backwards, or leave it
      # stale for the release that should have moved it. Only plain vX.Y.Z
      # tags compete; anything else is not "the newest".
      - id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          set -euo pipefail
          refs=""
          for attempt in 1 2 3; do
            if refs="$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" --jq '.[].ref')"; then
              break
            fi
            refs=""
            sleep 5
          done
          if [ -z "$refs" ]; then
            echo "::error::could not list ${REPO}'s v* tags; not guessing whether ${TAG} is the newest release (a guess could move :latest backwards)"
            exit 1
          fi
          top="$(printf '%s\n' "$refs" | sed 's|^refs/tags/||' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "${TAG}" = "${top}" ]; then
            echo "${TAG} is the newest release; it may move :latest."
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${TAG} is not the newest release (${top:-none}); :latest is left where it is."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      # The distribution name is read from the tagged tree, not restated.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.r.outputs.tag }}
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false

      # The per-version JSON endpoint, as scripts/release-watch.sh checks
      # it. Fails toward publishing: only an exact version match skips, so
      # a PyPI outage or a 404 lets the release run, and PyPI itself still
      # refuses a re-upload.
      - name: Is this version already on PyPI?
        id: pypi
        env:
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          PKG="$(python3 -c 'import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          got="$(curl -s "https://pypi.org/pypi/$PKG/$VERSION/json" \
                 | jq -r '.info.version // "absent"' 2>/dev/null)"
          if [[ "$got" == "$VERSION" ]]; then
            echo "::notice::$PKG $VERSION is already on PyPI -- another run released it. Ending green; nothing is built or published again."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PKG $VERSION is not on PyPI yet -- releasing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # A release tag must point at a commit `main` already certified green: ci.yml's
  # "CI passed" aggregator runs on every push to main, so re-running the full
  # 6x2 matrix here is a redundant third run (PR CI + main-push CI + this one).
  # Instead, gate on that commit's existing "CI passed" check — strictly safer
  # than re-running and hoping for parity, since it asserts the exact tree was
  # certified. If the tag is not on a green main commit, this fails the release.
  verify-ci:
    name: Verify CI already passed for this commit
    needs: resolve
    if: needs.resolve.outputs.published != 'true'
    runs-on: ubuntu-latest
    # Above the poll window below (ATTEMPTS x INTERVAL = 60 min), so the
    # poll's own timeout message fires first, not GitHub's bare cancel;
    # tests/test_gh1327_verify_ci_poll_window.py holds the ordering.
    timeout-minutes: 75
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require a green "CI passed" check for the tagged SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          # The merge that produced this commit may still be running its
          # main-push matrix, so poll until "CI passed" concludes, then
          # require success.
          #
          # gh-1327: the window is sized against main's OBSERVED CI duration,
          # not guessed. It polled for ~20 min while ci.yml took 21-37 min
          # (Coverage is the long pole), so the first attempt timed out on
          # EVERY release cut straight after a merge -- v0.76.0's ran
          # 00:11:06 -> 00:31:38, exactly 60 x 20s, and exited on the timeout
          # branch. `release-watch` then logged it as "likely a flake" and
          # spent the one pre-publish auto-recovery on it.
          #
          # This costs nothing when CI is fast: the loop exits on the first
          # conclusion. It is only the cap on how long we are willing to wait.
          # `tests/test_gh1327_verify_ci_poll_window.py` fails if the product
          # of these two drops below the floor the measurements justify, so
          # shortening it means facing that number.
          ATTEMPTS=180
          INTERVAL=20
          for i in $(seq 1 "$ATTEMPTS"); do
            runs="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.name == "CI passed")
                    | "\(.status) \(.conclusion)"' | head -n1)"
            status="${runs%% *}"
            conclusion="${runs#* }"
            if [[ -z "$status" ]]; then
              echo "No 'CI passed' check yet for $SHA (attempt $i/$ATTEMPTS); waiting..."
            elif [[ "$status" != "completed" ]]; then
              echo "'CI passed' is $status for $SHA (attempt $i/$ATTEMPTS); waiting..."
            elif [[ "$conclusion" == "success" ]]; then
              echo "'CI passed' is green for $SHA — proceeding to release."
              exit 0
            else
              echo "::error::'CI passed' concluded '$conclusion' for $SHA — refusing to release a tree CI did not certify."
              exit 1
            fi
            sleep "$INTERVAL"
          done
          echo "::error::Timed out after $((ATTEMPTS * INTERVAL / 60)) min waiting for 'CI passed' on $SHA. That is longer than main's CI has ever taken, so this is a real failure, not the gh-1327 race: check ci.yml on that commit."
          exit 1

  build:
    needs: [resolve, verify-ci]
    if: needs.resolve.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin the checkout to the resolved tag. On a tag push this is the ref
      # the default checkout would have taken anyway; on a dispatch the
      # default is the BRANCH, which would build the wrong tree entirely.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"

      # `make wheel`, not the command it runs. The published artifact was the
      # last build command CI knew and a developer could not reproduce: the
      # Makefile overrode WHEEL_CMD with `PYTHONPATH=src uv build --wheel
      # --no-build-isolation`, so `make wheel` and the release built the wheel
      # two different ways. Verified byte-identical (sha256 9699cd5c…), and the
      # override carried no justification back to the commit that introduced
      # it, so it is gone rather than propagated here — `--no-build-isolation`
      # would need the backend pre-installed on this bare runner anyway.
      - run: make wheel

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  # Smoke-test the actual built wheel BEFORE publish, so a broken artifact never
  # reaches PyPI. Installs the wheel into a fresh venv, asserts the version, and
  # runs a bundled example end-to-end (scaffold -> cmake build -> test) — the
  # real "does the shipped artifact work" check the dropped matrix used to cover.
  smoke:
    name: Smoke test the wheel
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # Backstop: a hung apt mirror once sat this step for ~56 min before it was
    # cancelled by hand. Fail the job in minutes instead so release-watch (or a
    # human) can rerun it cheaply — nothing has published yet (publish needs
    # smoke), so a rerun is safe.
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      # enable-cache: false is load-bearing, not tidying. This is the ONLY job
      # in the repo that runs setup-uv without actions/checkout — deliberately,
      # since it smoke-tests the built wheel rather than the tree. With no
      # checkout, setup-uv's cache-dependency-glob matches nothing, so the
      # cache key is derived from nothing that ever changes and THE CACHE NEVER
      # INVALIDATES (v9 says so in a warning).
      #
      # Everywhere else that is merely wasteful. Here it is a correctness risk
      # on the last gate before PyPI: the next step installs numpy alongside a
      # freshly built C extension, and a frozen numpy against a new ABI is
      # exactly the two-numpys mismatch that produced
      # "compiled using NumPy 1.x cannot be run in NumPy 2.4.6" (gh-811/814).
      # A gate that validates a wheel against a permanently stale dependency
      # set is weaker than it looks, and it is the one nobody re-reads.
      #
      # Silencing it with `cache-dependency-glob: ""` would keep the same
      # never-invalidating cache and only hide the warning.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false

      - name: System build deps (cmake + C compiler)
        run: |
          # Retry with a per-attempt timeout so a stalled mirror can't hang the
          # job: 3 attempts, 5-min cap each (matches ci.yml's Acquire::Retries).
          for attempt in 1 2 3; do
            # The per-request timeouts turn a stall into an error the
            # retries cover (gh-1792); `timeout 300` caps the whole call.
            sudo timeout 300 apt-get -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=3 \
                   -o Acquire::http::Timeout=30 \
                   -o Acquire::https::Timeout=30 install -y \
                   cmake build-essential pkg-config patchelf \
              && exit 0
            echo "apt build-deps attempt $attempt failed/timed out; retrying…"
            sleep 10
          done
          echo "::error::apt build-deps failed after 3 attempts"
          exit 1

      - name: Install the built wheel (+ numpy) into a fresh venv
        run: |
          wheel="$(ls dist/*.whl)"
          uv venv .smoke
          uv pip install --python .smoke numpy "$wheel"

      - name: Version matches the tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          source .smoke/bin/activate
          got="$(just-makeit --version)"
          echo "installed: $got"
          case "$got" in
            *"${TAG#v}"*) ;;
            *) echo "::error::version mismatch (want ${TAG#v}, got '$got')"; exit 1 ;;
          esac

      - name: End-to-end bundled example (scaffold -> build -> test)
        run: |
          source .smoke/bin/activate
          just-makeit example fir_filter

  # gh-851: the full artifact smoke suite, run against the wheel we are about
  # to publish rather than against the one we already did.
  #
  # `artifact.yml` used to run ONLY post-publish, on `workflow_run` after
  # Release completed. It could not block anything by construction, nothing
  # reported its failure, and it sat red across 34 runs and three releases
  # with every dashboard green. A gate whose result nobody reads is worse than
  # an absent one, because its presence gets cited as coverage.
  #
  # Exactly one of its 31 steps needs real PyPI (the install), so the other 30
  # are moved to where they can still stop a release. The post-publish trigger
  # stays for the one thing only a published artifact can answer: that PyPI
  # actually serves an installable wheel at that version.
  artifact-smoke:
    name: Artifact smoke (pre-publish)
    needs: [resolve, build]
    uses: ./.github/workflows/artifact.yml
    with:
      wheel-artifact: dist
      version: ${{ needs.resolve.outputs.tag }}

  publish:
    needs: [resolve, smoke, artifact-smoke]
    if: needs.resolve.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # gh-2310: runs after a publish that succeeded, AND when publish was skipped
  # only because the version is already on PyPI -- a duplicate run, or
  # "Re-run all jobs" after a release that published and then failed here.
  # The skip used to cascade through `needs` and end such a run green with no
  # GitHub Release. `!cancelled()` is the status function that stops that
  # cascade, so the condition says which skips are acceptable: only publish's,
  # and only for a published version. A publish that FAILED, or a smoke that
  # failed before it, still skips this job.
  github-release:
    needs: [resolve, publish]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' ||
      (needs.publish.result == 'skipped' &&
      needs.resolve.outputs.published == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Extract changelog section for this tag
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG}"              # e.g. v0.10.7
          VER="${TAG#v}"                    # strip leading v → 0.10.7
          # Pull the block from ## [VER] down to the next ## heading (exclusive).
          # Match the literal `## [VER]` prefix with index() — a regex would need
          # the version's dots escaped. Write the block to a FILE and hand it to
          # `gh release` via --notes-file: the old form inlined the notes with a
          # templated expression in the shell, which pasted the changelog text
          # into the script source so backticks / parens / braces ran as shell
          # commands and aborted the job (release-notes shell injection).
          # (NB: do not write a GitHub Actions expression literal in this
          # comment — the runner parses one even inside a shell comment.)
          awk -v ver="$VER" \
            'index($0, "## [" ver "]") == 1 {found=1; next}
             found && /^## / {exit}
             found {print}' CHANGELOG.md > release-notes.md
          cat release-notes.md

      # Idempotent (gh-2310): this job also runs for a version PyPI already
      # serves, where the first run may have created the release. An existing
      # release is left exactly as it is -- a re-run must not rewrite notes a
      # person may have edited. The runs for one tag are serialised by the
      # workflow's concurrency group, so two never reach this step together;
      # the second check below only covers a create that lost a race anyway.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          # "true" only for the newest release. `--latest` moves GitHub's
          # "Latest release" badge, and a release created now for an OLDER tag
          # (a re-run or dispatch where it is missing) must not take it back.
          NEWEST: ${{ needs.resolve.outputs.newest }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::notice::${RELEASE_TAG} already has a GitHub Release; leaving it as it is."
            exit 0
          fi
          latest=false
          if [ "${NEWEST}" = "true" ]; then latest=true; fi
          if ! gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            "--latest=${latest}" \
            --notes-file release-notes.md; then
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "::notice::${RELEASE_TAG} was released by another run while this one tried."
              exit 0
            fi
            exit 1
          fi

  # gh-2310: is this commit's multi-arch image already in GHCR? `docker` is a
  # called workflow, which has no steps of its own to ask, so the question is
  # a job. It answers FALSE on any doubt -- no login, a registry error, a tag
  # that cannot be read -- because the cost of a wrong "absent" is rebuilding
  # an image (`imagetools create` overwrites its tags), and the cost of a
  # wrong "present" is a release with no image. The tag is the one docker.yml
  # writes, `sha-<commit>`; the commit is the resolved tag's.
  #
  # It matters only for a version already on PyPI. After a `publish` that
  # succeeded in THIS run, docker runs whatever the registry says: main's push
  # CI also publishes `sha-<commit>` for the release commit (measured on
  # v0.111.2: its manifest job finished 38 minutes before this workflow's
  # docker job began), so a probe taken later in the run would find the image
  # and skip the release's own build. Which path a first run takes must not
  # depend on how long `verify-ci` waited, so the probe is not asked.
  image-state:
    name: Is the image already published?
    needs: resolve
    if: needs.resolve.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - uses: docker/login-action@v4.6.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: probe
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -uo pipefail
          ref="ghcr.io/${OWNER}/jm-examples-linux:sha-${SHA}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::notice::$ref is already published; the image is not built again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$ref is not published (or could not be read) -- the image is built."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs after a release that exists (gh-2310): always after a `publish` that
  # succeeded in this run, and for a version already on PyPI only when its
  # image is absent. See `github-release`: `!cancelled()` stops a skipped
  # `publish` cascading here, and `github-release` succeeding is what says
  # the version is released.
  docker:
    needs: [resolve, publish, github-release, image-state]
    if: >-
      ${{ !cancelled() && needs.github-release.result == 'success' &&
      (needs.publish.result == 'success' ||
      (needs.image-state.result == 'success' &&
      needs.image-state.outputs.exists != 'true')) }}
    uses: ./.github/workflows/docker.yml
    with:
      # Explicit, because a called workflow otherwise inherits THIS workflow's
      # ref — the tag on a push, but the branch on a dispatch.
      ref: ${{ needs.resolve.outputs.tag }}
      publish: true
      # Only the newest release may move `:latest` (gh-2310). docker runs for
      # a version already on PyPI, and the manifest step overwrites its tags.
      latest: ${{ needs.resolve.outputs.newest == 'true' }}
      # The image is named for the RESOLVED tag's commit, the key `image-state`
      # probes, not for whichever commit this workflow was dispatched from.
      sha: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
