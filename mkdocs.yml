    - Filter module: examples/filter_module.md
    - Module functions: examples/jm_function.md
    - IQ file: examples/iqfile.md
    - NCO tone: examples/nco_tone.md
    - App scaffolding: examples/jm_app.md
    - Three faces: examples/three_face.md
    - Declarative scaffold: examples/declarative_scaffold.md
    - pytest style: examples/pytest_style.md
