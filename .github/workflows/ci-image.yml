name: CI image

# Builds jm's CI toolchain image (docker/Dockerfile.ci) and re-pins
# .github/ci-image to it, through a PR -- never by pushing to main. That PR's
# CI runs on the new image, so a toolchain change lands only through green
# CI, and reverting one line rolls it back. scripts/ci_image.py explains the
# pins; `make help` lists the targets.
#
# Weekly, every input moves to today's (base digest, apt snapshot, uv
# digest), so the toolchain is never more than a week stale and never
# changes in between. Dispatched from a branch with refresh=false, it builds
# that branch's Dockerfile as it stands and commits the pin onto the branch:
# how a PR that edits the Dockerfile or bootstrap.toml's dev.apt satisfies
# `make ci-image-check`.
#
# A PR or push opened with GITHUB_TOKEN starts no workflow, so this
# dispatches ci.yml on the branch itself; the `CI passed` check that run
# reports on the head commit is the one the ruleset requires.

on:
  schedule:
    # Monday 04:23 UTC -- weekly, offset off the hour to avoid the
    # scheduler's peak.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Move the base, apt snapshot and uv pins to today's first
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Pin today's inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Move the pins
        if: github.event_name == 'schedule' || inputs.refresh
        run: make ci-image-refresh

      - name: Name the image by its snapshot
        id: tag
        run: |
          s=$(sed -n 's/^ARG APT_SNAPSHOT=//p' docker/Dockerfile.ci)
          echo "tag=${s}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dockerfile-ci
          path: docker/Dockerfile.ci
          if-no-files-found: error

  build:
    name: Build and smoke (${{ matrix.arch }})
    needs: refresh
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dockerfile-ci
          path: docker

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: make ci-image-build CI_IMAGE_TAG=jm-ci:smoke

      - name: Smoke
        run: make ci-image-smoke CI_IMAGE_TAG=jm-ci:smoke

      # An arch-suffixed tag only; the publish job joins them into the one
      # multi-arch index that gets pinned, so nothing ever pins a
      # single-arch image.
      - name: Push the arch image
        env:
          REF: ghcr.io/${{ github.repository_owner }}/jm-ci:${{ needs.refresh.outputs.tag }}-${{ matrix.arch }}
        run: |
          docker tag jm-ci:smoke "$REF"
          docker push "$REF"

  publish:
    name: Re-pin through a PR
    needs: [refresh, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dockerfile-ci
          path: docker

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the arches and pin the index
        env:
          BASE: ghcr.io/${{ github.repository_owner }}/jm-ci
          TAG: ${{ needs.refresh.outputs.tag }}
        run: |
          docker buildx imagetools create -t "$BASE:$TAG" \
            "$BASE:$TAG-amd64" "$BASE:$TAG-arm64"
          d=$(docker buildx imagetools inspect "$BASE:$TAG" \
                --format '{{json .Manifest}}' | jq -r .digest)
          echo "$BASE@$d" > .github/ci-image

      # The gate ci.yml runs, against the pin about to be proposed: an index
      # that does not carry this tree's inputs on every arch stops here.
      - run: make ci-image-check

      - name: Commit, and open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.refresh.outputs.tag }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT" ]]; then
            branch="chore/ci-image-$TAG"
            git switch -c "$branch"
          else
            branch="$GITHUB_REF_NAME"
          fi
          git add .github/ci-image docker/Dockerfile.ci
          git commit -m "chore(ci): pin the CI toolchain image $TAG"
          git push origin "HEAD:$branch"
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT" ]]; then
            gh pr create --base "$DEFAULT" --head "$branch" \
              --title "chore(ci): pin the CI toolchain image $TAG" \
              --body "Weekly refresh by ci-image.yml (run $GITHUB_RUN_ID): the base, apt snapshot and uv pins in docker/Dockerfile.ci moved to today's, and .github/ci-image pins the image built from them. CI on this PR runs on the new image; merging adopts it."
          fi
          gh workflow run ci.yml --ref "$branch"
