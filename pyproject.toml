[build-system]
requires = ["just-buildit>=0.3.6"]
build-backend = "just_buildit"

[project]
name = "just-makeit"
version = "0.13.21"
description = "Scaffold and build Python C extensions with CMake and just-buildit."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matthew T. Hunter, Ph.D." },
    { name = "Claude Code", email = "noreply@anthropic.com" },
]
dependencies = []
keywords = [
    "c-extension", "cmake", "pep517", "build-backend", "scaffolding",
    "code-generation", "numpy", "packaging", "wheel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/just-buildit/just-makeit"
Repository = "https://github.com/just-buildit/just-makeit"
"Bug Tracker" = "https://github.com/just-buildit/just-makeit/issues"

[project.scripts]
just-makeit = "just_makeit._cli:main"
jm = "just_makeit._cli:main"
jm-install-deps = "just_makeit._scripts:install_deps"
jm-run-tests = "just_makeit._scripts:run_tests"
jm-docker-e2e = "just_makeit._scripts:docker_e2e"

[tool.just-buildit]
# just-makeit is pure Python — but src/just_makeit/examples/ ships .c source
# fragments as package data. 'pure' tells just-buildit to copy the tree
# verbatim (keeping those .c/.h files) and compile nothing.
pure = true

[tool.ruff]
extend-exclude = ["src/just_makeit/templates/"]

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["E402"], "docker/*" = ["E402"], "src/just_makeit/examples/*" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["just_makeit"]
branch = true
parallel = true
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]


[dependency-groups]
dev = [
    "cmakelang",
    "just-buildit",
    "mkdocstrings-python>=2.0.3",
    "numpy",
    "pre-commit",
    "pytest",
    "pytest-benchmark",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.29",
]
