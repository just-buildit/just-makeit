name: nco_tone example

# This job is an integration gate over *generated* code built against a real
# external library, so it can break two ways the repo cannot see:
#
#   1. A jm change anywhere in the generator alters what the example emits.
#      The old filter named three source files, so a break introduced through
#      any other module (gh-607's codegen, for one) merged with this job never
#      running.
#   2. doppler publishes a release with a changed API. The install step below
#      downloads the *latest* release, so this breaks with no commit here at
#      all — which is exactly what happened on 2026-07-29: doppler v0.39.0 gave
#      `nco_steps_u32` a fourth `max_out` parameter three hours after the last
#      green run, and nothing observed it until an unrelated PR happened to
#      touch one of the three named files.
#
# Hence: never filtered on main (the job is ~2.5 min green — filtering it is a
# false economy against a silently red main), broadly filtered on PRs so a
# docs-only PR stays free, and scheduled so case 2 is found by the schedule
# rather than by the next contributor.
on:
  push:
    branches: ["main"]
    # A release bump moves only these four files and cannot affect the
    # end-to-end example, so it should not trigger one.
    paths-ignore:
      - CHANGELOG.md
      - pyproject.toml
      - bootstrap.toml
      - uv.lock
  pull_request:
    paths:
      - "src/just_makeit/**"
      - "pyproject.toml"
      - ".github/workflows/nco_tone_ci.yml"
  schedule:
    # 06:17 UTC daily — offset off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  nco-tone:
    name: nco_tone (Ubuntu, static doppler)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      # `make install-deps-dev`, not a hand-picked apt line: bootstrap.toml is the
      # SSOT for which system packages a build needs, and the transcribed
      # `cmake gcc` here was already a narrower list than the dev group it
      # meant to install.
      - name: Install system build tools
        run: make install-deps-dev

      # `make tool-install`, not `uv tool install .` — the target exists
      # precisely because ci.yml hand-rolled this (it wraps the install in a
      # retry for the transient network failure that flaked CI), and this
      # workflow was missed when the rest moved over.
      - name: Install just-makeit
        run: |
          make tool-install
          make setup

      - name: Install jm build deps (cmake, Python, NumPy)
        run: jm-install-deps ${{ runner.temp }}/jm-venv

      # ── Install doppler from its GitHub release ────────────────────────────
      # doppler ships a self-contained static target (doppler::doppler-static),
      # which the example links — so we just extract the tarball; no .so strip
      # or SHARED→STATIC cmake patching is needed (that hack was for the old
      # single doppler::doppler_lib SHARED target, removed in 0.13.x).
      - name: Download doppler release
        run: |
          # `doppler-*` is too loose: the release also carries
          # `doppler-starter-<ver>-linux-x86_64.tar.gz`, which appeared on
          # 2026-08-22 and matched. A version always starts with a digit, so
          # anchoring on that selects the library tarball and nothing else.
          gh release download \
            --repo doppler-dsp/doppler \
            --pattern "doppler-[0-9]*-linux-x86_64.tar.gz" \
            --dir /tmp/doppler-dl
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install doppler
        run: |
          mkdir -p /tmp/doppler
          # Resolve the glob to ONE file and say so if it is not one. A glob
          # straight into `tar xzf` is what turned the extra asset into
          # "tar: doppler-starter-...: Not found in archive": with two
          # matches, `tar xzf A B` reads B as a MEMBER to extract from A, so
          # the wrong-number-of-files case cannot be told from a corrupt
          # archive. The failure mode is not that the glob was loose, it is
          # that the command had no way to report it.
          shopt -s nullglob
          tarballs=(/tmp/doppler-dl/doppler-[0-9]*-linux-x86_64.tar.gz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 doppler tarball," \
                 "got ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          tar xzf "${tarballs[0]}" -C /tmp/doppler --strip-components=1
          # Which doppler this ran against is the first question a failure
          # raises, and the download above is unpinned — so state it in the log
          # rather than making the next reader infer it from the run date.
          echo "::notice::built against $(basename "${tarballs[0]}")"

      # ── Run the nco_tone example ────────────────────────────────────────────
      # Pass the install prefix; cmake's find_package searches both
      # <prefix>/lib/cmake and <prefix>/lib64/cmake, so this is libdir-agnostic.
      - name: Run nco_tone example
        run: |
          uv run python src/just_makeit/examples/nco_tone/test.py \
            --doppler-prefix /tmp/doppler
