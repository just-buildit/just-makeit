name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # A release tag must point at a commit `main` already certified green: ci.yml's
  # "CI passed" aggregator runs on every push to main, so re-running the full
  # 6x2 matrix here is a redundant third run (PR CI + main-push CI + this one).
  # Instead, gate on that commit's existing "CI passed" check — strictly safer
  # than re-running and hoping for parity, since it asserts the exact tree was
  # certified. If the tag is not on a green main commit, this fails the release.
  verify-ci:
    name: Verify CI already passed for this commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require a green "CI passed" check for the tagged SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # The merge that produced this commit may still be running its
          # main-push matrix, so poll until "CI passed" concludes (up to ~20
          # min), then require success.
          for i in $(seq 1 60); do
            runs="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.name == "CI passed")
                    | "\(.status) \(.conclusion)"' | head -n1)"
            status="${runs%% *}"
            conclusion="${runs#* }"
            if [[ -z "$status" ]]; then
              echo "No 'CI passed' check yet for $SHA (attempt $i/60); waiting..."
            elif [[ "$status" != "completed" ]]; then
              echo "'CI passed' is $status for $SHA (attempt $i/60); waiting..."
            elif [[ "$conclusion" == "success" ]]; then
              echo "'CI passed' is green for $SHA — proceeding to release."
              exit 0
            else
              echo "::error::'CI passed' concluded '$conclusion' for $SHA — refusing to release a tree CI did not certify."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for 'CI passed' on $SHA. Tag a commit merged to main that CI certified green."
          exit 1

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      # `make wheel`, not the command it runs. The published artifact was the
      # last build command CI knew and a developer could not reproduce: the
      # Makefile overrode WHEEL_CMD with `PYTHONPATH=src uv build --wheel
      # --no-build-isolation`, so `make wheel` and the release built the wheel
      # two different ways. Verified byte-identical (sha256 9699cd5c…), and the
      # override carried no justification back to the commit that introduced
      # it, so it is gone rather than propagated here — `--no-build-isolation`
      # would need the backend pre-installed on this bare runner anyway.
      - run: make wheel

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  # Smoke-test the actual built wheel BEFORE publish, so a broken artifact never
  # reaches PyPI. Installs the wheel into a fresh venv, asserts the version, and
  # runs a bundled example end-to-end (scaffold -> cmake build -> test) — the
  # real "does the shipped artifact work" check the dropped matrix used to cover.
  smoke:
    name: Smoke test the wheel
    needs: build
    runs-on: ubuntu-latest
    # Backstop: a hung apt mirror once sat this step for ~56 min before it was
    # cancelled by hand. Fail the job in minutes instead so release-watch (or a
    # human) can rerun it cheaply — nothing has published yet (publish needs
    # smoke), so a rerun is safe.
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: System build deps (cmake + C compiler)
        run: |
          # Retry with a per-attempt timeout so a stalled mirror can't hang the
          # job: 3 attempts, 5-min cap each (matches ci.yml's Acquire::Retries).
          for attempt in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 300 apt-get install -y \
                   cmake build-essential pkg-config patchelf \
              && exit 0
            echo "apt build-deps attempt $attempt failed/timed out; retrying…"
            sleep 10
          done
          echo "::error::apt build-deps failed after 3 attempts"
          exit 1

      - name: Install the built wheel (+ numpy) into a fresh venv
        run: |
          wheel="$(ls dist/*.whl)"
          uv venv .smoke
          uv pip install --python .smoke numpy "$wheel"

      - name: Version matches the tag
        run: |
          source .smoke/bin/activate
          got="$(just-makeit --version)"
          echo "installed: $got"
          case "$got" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "::error::version mismatch (want ${GITHUB_REF_NAME#v}, got '$got')"; exit 1 ;;
          esac

      - name: End-to-end bundled example (scaffold -> build -> test)
        run: |
          source .smoke/bin/activate
          just-makeit example fir_filter

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Extract changelog section for this tag
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.10.7
          VER="${TAG#v}"                    # strip leading v → 0.10.7
          # Pull the block from ## [VER] down to the next ## heading (exclusive).
          # Match the literal `## [VER]` prefix with index() — a regex would need
          # the version's dots escaped. Write the block to a FILE and hand it to
          # `gh release` via --notes-file: the old form inlined the notes with a
          # templated expression in the shell, which pasted the changelog text
          # into the script source so backticks / parens / braces ran as shell
          # commands and aborted the job (release-notes shell injection).
          # (NB: do not write a GitHub Actions expression literal in this
          # comment — the runner parses one even inside a shell comment.)
          awk -v ver="$VER" \
            'index($0, "## [" ver "]") == 1 {found=1; next}
             found && /^## / {exit}
             found {print}' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --latest \
            --notes-file release-notes.md

  docker:
    needs: github-release
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
