# gh-2075: `jm remove` takes out a function an app is built from and
# leaves `[app]` naming it, so `status` and `apply` both fail. Removing the
# module that holds it does the same (seen once gh-2076 let `apply` run on a
# manifest that declares nothing).

[[red]]
runs = [
    ["remove", "function", "apps"],
    ["remove", "module", "apps"],
]
found = [
    "status:exit 1",
    "apply:refused error: function 'f' not found in module 'mod'.",
    "fresh:refused error: function 'f' not found in module 'mod'.",
]
