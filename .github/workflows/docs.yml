name: Docs

on:
  push:
    branches: [main]
  # On a PR, build only when something that can actually change the site
  # changed. Deliberately asymmetric with the push trigger above, which stays
  # unfiltered: freshness of the deployed site is not a PR concern, and a path
  # list that misses a case would silently serve a stale site.
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - zensical.toml
      - README.md
      - src/just_makeit/**
      - pyproject.toml
      - .github/workflows/docs.yml
  # A run that fails before any job starts (2026-10-02: the Actions policy
  # briefly allowed local actions only) cannot be re-run, and with no other
  # trigger the site stayed two merges stale until the next push. Dispatched
  # from main it builds and deploys; from a branch it only builds.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one deploy at a time; don't cancel in-progress deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A version bump alone builds nothing here: see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      checks: read
      contents: read

  # ------------------------------------------------------------------
  # Build — runs on every push and PR
  # ------------------------------------------------------------------
  build:
    name: Build
    needs: changes
    # A push to main always builds and deploys (see the trigger comment);
    # a PR builds unless it is a version bump alone.
    if: github.event_name == 'push' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      - name: Build docs site
        # `make docs`, not the two commands it runs. They were spelled out
        # here and were a second implementation of the docs build: this copy
        # hardcoded `python3` while the Makefile resolves the project
        # interpreter through uv, so CI and a developer could copy the example
        # READMEs with different Pythons and only notice downstream.
        #
        # The target keeps the ordering the build depends on — the strict
        # build aborts on a broken internal link, and docs/examples/*.md only
        # exist after the copy step — in one place that the drift gate and
        # `make docs-check` also use.
        run: make docs

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/

  # ------------------------------------------------------------------
  # Deploy — only on push to main
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
