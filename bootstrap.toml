[project]
name    = "just-makeit"
version = "0.127.1"

[tools.install-deps]
source = "just-bashit:install-deps"
groups = ["dev"]

# System build deps required to compile generated C extensions in examples/CI.

# clang: the -Werror scaffold sweep builds every shape under gcc AND clang,
# and skips without it (gh-1796). On macOS Xcode supplies it; on Windows,
# clang-cl comes with Visual Studio.
[dev.apt]
packages = ["build-essential", "clang", "cmake", "pkg-config", "python3-dev", "python3-numpy"]

[dev.brew]
packages = ["cmake", "pkg-config"]

[dev.pacman]
packages = ["base-devel", "clang", "cmake", "pkgconf", "python", "python-numpy"]

[dev.dnf]
packages = ["gcc", "clang", "make", "cmake", "pkgconf-pkg-config", "python3-devel", "python3-numpy"]

[dev.zypper]
packages = ["gcc", "clang", "make", "cmake", "pkg-config", "python3-devel", "python3-numpy"]

# Windows: clang-cl against the MSVC ABI (gh-1368). The Build Tools id says
# nothing about its workloads, so vs_requires names what jm needs and
# install-deps probes for exactly that (vswhere), adding it when absent:
# the MSVC libraries + Windows SDK + CMake/Ninja (VCTools) and clang-cl
# (VC.Llvm.Clang). make, uv and Git Bash run jm's own Makefile (gh-2598).
[dev.winget]
packages = [
    "Microsoft.VisualStudio.BuildTools",
    "ezwinports.make",
    "astral-sh.uv",
    "Git.Git",
]

[dev.winget."Microsoft.VisualStudio.BuildTools"]
vs_requires = [
    "Microsoft.VisualStudio.Workload.VCTools",
    "Microsoft.VisualStudio.Component.VC.Llvm.Clang",
]
