# This file decides WHEN a check runs (which paths trigger it) and in what
# order. It does NOT decide how a tool is invoked or which version it is —
# the Makefile owns invocation, pyproject.toml's `dev` group owns versions,
# and uv.lock pins them. Hooks for Python tooling therefore call `make`
# targets rather than repeating a command line that can drift from `make
# format` (it did: an unpinned `uvx ruff` reformatted files the pinned ruff
# left alone, and unpinned mdformat `additional_dependencies` drifted the
# plugin set out from under a config that still claimed otherwise).
#
# That now includes the two local scripts below. They carried
# `entry: python3 scripts/<x>.py`, which is the same drift wearing a different
# hat: bare `python3` is whatever is on PATH rather than the locked dev env,
# and with the command living only here there was no way to run by hand what
# the hook runs. Both go through `make -s lint-<tool>` like every other one,
# so the hook, `make lint`, and the CI lint job are one invocation.
#
# clang-format and cmake-format stay on their upstream mirrors: they are not
# Python project dependencies, so pinning them in pyproject would be a lie.
repos:
  - repo: local
    hooks:
      - id: sync-bootstrap-version
        name: sync bootstrap.toml version from pyproject.toml
        entry: make -s lint-sync-version
        language: system
        files: ^(pyproject\.toml|bootstrap\.toml)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.28
    hooks:
      - id: uv-lock

  # Python + markdown formatting, dispatched through the Makefile so the hook
  # and `make format` cannot disagree. Each runs over the whole tree
  # (pass_filenames: false) because that is what its make target does — a hook
  # scoped to staged files could pass while the CI gate, which lints
  # everything, fails on the same commit.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: make -s lint-ruff
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: make -s lint-ruff-format
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      # The plugin set and the exclusions both live in the Makefile now: the
      # excludes were previously duplicated here as a regex, and the plugins
      # were unpinned `additional_dependencies`. `make lint-mdformat`
      # self-skips on Python 3.9, where mdformat 1.x will not install.
      - id: mdformat
        name: mdformat
        entry: make -s lint-mdformat
        language: system
        pass_filenames: false
        types: [markdown]

      # These two were the last hooks running a tool from an upstream mirror
      # rather than through make. That put their versions in a `rev:` instead
      # of the dev group, and — because the make-ssot hook derives its map
      # from the makefiles — left both INVISIBLE to it: `ruff check .` was
      # denied while `clang-format -i native/src/x.c` was allowed, in the repo
      # whose entire C surface is generated. The file selection each mirror
      # applied now lives in the Makefile, unchanged, and the pins moved to
      # the dev group at the exact versions the revs carried.
      #
      # `additional_dependencies: [pyyaml]` is gone with them: that existed
      # only to repair cmake-format's ISOLATED hook env, which could not see
      # the project's own. Running through `make` there is no second env.
      - id: clang-format
        name: clang-format
        entry: make -s lint-clang-format
        language: system
        pass_filenames: false
        types_or: [c, c++]

      - id: cmake-format
        name: cmake-format
        entry: make -s lint-cmake-format
        language: system
        pass_filenames: false
        files: ^src/just_makeit/templates/cmake/

  # Must stay LAST: an example README inlines its .steps/ scripts verbatim, so
  # this has to observe the rewrites ruff-format/clang-format just made rather
  # than race them. Otherwise a reformatted step script leaves the README
  # quoting pre-format text and only CI notices (assemble.py --check).
  #
  # `pass_filenames: false` now, so it re-assembles every example rather than
  # only the ones a commit touched. A staged-scope hook can pass while the
  # whole-tree CI check fails on the same commit — the split this dispatch
  # exists to close, and the reason every other hook here is whole-tree.
  # Measured cost of all 13 instead of one: 0.27s.
  - repo: local
    hooks:
      - id: assemble-examples
        name: re-assemble example READMEs from .steps/
        entry: make -s lint-assemble-examples
        language: system
        pass_filenames: false
        files: ^src/just_makeit/examples/[^/]+/\.steps/
